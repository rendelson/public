<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Frida Kahlo Stories</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Caveat:wght@600&family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#7a1035;--bg2:#4a0a22;--gold:#f4b43a;--pink:#ff6f91;--teal:#1f8a7a;--cream:#fff4e3;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;overflow:hidden;background:var(--bg2)}
  .story{position:relative;width:1080px;height:1920px;
    background:radial-gradient(ellipse at 50% 45%,var(--bg) 0%,var(--bg2) 75%);
    color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 110px;text-align:center}
  .crown{position:absolute;top:0;left:0;width:100%}
  .crown.bottom{top:auto;bottom:0;transform:scaleY(-1)}
  .mark{font-family:'Playfair Display',serif;font-size:260px;line-height:.6;color:var(--gold);opacity:.9;margin-bottom:30px}
  .quote{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:68px;line-height:1.32}
  .quote b{font-style:normal;font-weight:600;color:var(--gold)}
  .hl{color:var(--pink);font-style:normal;font-weight:600}
  .rule{width:160px;height:4px;background:var(--gold);border-radius:2px;margin:70px auto 40px}
  .sig{font-family:'Caveat',cursive;font-size:96px;color:var(--gold)}
  .sub{font-family:'Montserrat',sans-serif;letter-spacing:.35em;font-size:26px;text-transform:uppercase;opacity:.75;margin-top:6px}
</style>
</head>
<body>
<div class="story">
  <svg class="crown" viewBox="0 0 1080 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="flower">
        <circle cx="0" cy="-34" r="30"/><circle cx="32" cy="-11" r="30"/><circle cx="20" cy="28" r="30"/>
        <circle cx="-20" cy="28" r="30"/><circle cx="-32" cy="-11" r="30"/>
      </g>
      <g id="leaf"><path d="M0 0 C30 -40 80 -40 110 0 C80 40 30 40 0 0Z"/></g>
    </defs>
    <g fill="#1f8a7a">
      <use href="#leaf" transform="translate(40 120) rotate(-20)"/>
      <use href="#leaf" transform="translate(250 60) rotate(25)"/>
      <use href="#leaf" transform="translate(460 150) rotate(-35)"/>
      <use href="#leaf" transform="translate(640 70) rotate(15)"/>
      <use href="#leaf" transform="translate(860 140) rotate(-15)"/>
      <use href="#leaf" transform="translate(980 40) rotate(40)"/>
    </g>
    <g transform="translate(140 110) scale(1.5)" fill="#ff6f91"><use href="#flower"/><circle r="16" fill="#f4b43a"/></g>
    <g transform="translate(380 70) scale(1.1)" fill="#f4b43a"><use href="#flower"/><circle r="16" fill="#7a1035"/></g>
    <g transform="translate(560 120) scale(1.8)" fill="#e8264f"><use href="#flower"/><circle r="16" fill="#f4b43a"/></g>
    <g transform="translate(760 60) scale(1.2)" fill="#ff9e4f"><use href="#flower"/><circle r="16" fill="#7a1035"/></g>
    <g transform="translate(950 120) scale(1.6)" fill="#ff6f91"><use href="#flower"/><circle r="16" fill="#f4b43a"/></g>
    <g fill="#fff4e3" opacity=".8">
      <circle cx="270" cy="160" r="9"/><circle cx="470" cy="40" r="7"/><circle cx="680" cy="170" r="9"/><circle cx="860" cy="30" r="7"/>
    </g>
  </svg>

  <div class="mark">“</div>
  <p class="quote">
    Eu pensava que era a <span class="hl">pessoa mais estranha</span> do mundo.<br><br>
    Mas há tanta gente no mundo que deve existir <b>alguém como eu</b>, que se sente estranha e imperfeita do mesmo jeito que eu.
  </p>
  <div class="rule"></div>
  <div class="sig">Frida Kahlo</div>
  <div class="sub">pintora · méxico</div>

  <svg class="crown bottom" viewBox="0 0 1080 360" xmlns="http://www.w3.org/2000/svg">
    <g fill="#1f8a7a">
      <path d="M0 0 C30 -40 80 -40 110 0 C80 40 30 40 0 0Z" transform="translate(60 90) rotate(15)"/>
      <path d="M0 0 C30 -40 80 -40 110 0 C80 40 30 40 0 0Z" transform="translate(520 60) rotate(-20)"/>
      <path d="M0 0 C30 -40 80 -40 110 0 C80 40 30 40 0 0Z" transform="translate(900 100) rotate(20)"/>
    </g>
    <g transform="translate(260 80) scale(1.3)" fill="#f4b43a"><circle cx="0" cy="-34" r="30"/><circle cx="32" cy="-11" r="30"/><circle cx="20" cy="28" r="30"/><circle cx="-20" cy="28" r="30"/><circle cx="-32" cy="-11" r="30"/><circle r="16" fill="#e8264f"/></g>
    <g transform="translate(800 70) scale(1.4)" fill="#ff6f91"><circle cx="0" cy="-34" r="30"/><circle cx="32" cy="-11" r="30"/><circle cx="20" cy="28" r="30"/><circle cx="-20" cy="28" r="30"/><circle cx="-32" cy="-11" r="30"/><circle r="16" fill="#f4b43a"/></g>
  </svg>
</div>
</body>
</html>
